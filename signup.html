<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="signup">
        <header>
            <a href="./index.html"><img src="./images/circle-user-round.svg" alt=""></a>
            <h1>Sign Up</h1>
        </header>
        <section>
            <div class="inputs">
                <div class="full-name">
                    <h3>Full Name</h3>
                    <input type="text" placeholder="Full Name">
                </div>
                <div class="password">
                    <h3>Password</h3>
                    <input type="password" placeholder="Password">
                </div>
            </div>
        </section>
        <div class="google-button">
            <a href="https://google.com"><button>Sign Up with Google</button></a>
        </div>
    </div>
    <script src="./books.js"></script>
    <script src="./script.js"></script>
</body>

</html>
